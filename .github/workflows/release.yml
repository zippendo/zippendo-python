name: Release

# Zippendo's release pipeline generates this SDK and pushes a version tag; this workflow publishes it.
# Publishing from this public repository with PyPI trusted publishing is what attaches attestations
# that link each file to this commit and run. The trusted publisher on pypi.org names this file and
# the `release` environment, so renaming either stops releases until that setting is updated.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  # Built in its own job so the code that runs during the build never holds the publish credential.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Check the tag matches the package version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "v$version" = "$GITHUB_REF_NAME"

      - name: Build
        run: |
          python -m pip install build
          python -m build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/zippendo
    permissions:
      contents: write # the GitHub release
      id-token: write # PyPI trusted publishing and attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # skip-existing makes a failed run safe to re-run.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 && exit 0
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes \
            "Install with \`pip install zippendo==${GITHUB_REF_NAME#v}\`. Guide: https://www.zippendo.com/docs/sdks/overview" \
            dist/*.whl dist/*.tar.gz
